<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="4.0.2">
<title>سامانه مدیریت انضباطی مدرسه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--panel:rgba(14,18,30,.78);--border:rgba(110,150,220,.14);--border-2:rgba(0,229,255,.4);--text:#e7eefc;--text-dim:#8d97b0;--text-mute:#5b6478;--cyan:#00e5ff;--magenta:#ff2bd6;--green:#00ff9d;--yellow:#ffd60a;--orange:#ff8c1a;--red:#ff3a5e;--purple:#a855f7;--r:14px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Vazirmatn',system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg-grid,.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-grid{background-image:linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(ellipse at 50% 30%,#000 40%,transparent 90%)}
.bg-glow{background:radial-gradient(ellipse 60% 40% at 15% 0%,rgba(0,229,255,.10),transparent 60%),radial-gradient(ellipse 50% 40% at 90% 100%,rgba(255,43,214,.08),transparent 60%)}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh;position:relative;z-index:1}
.sidebar{background:linear-gradient(180deg,rgba(10,13,22,.92),rgba(8,10,18,.86));border-left:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid var(--border)}
.brand-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:22px;color:#04060c;background:linear-gradient(135deg,var(--cyan),var(--magenta));box-shadow:0 0 20px rgba(0,229,255,.5)}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text strong{font-size:15px}
.brand-text span{font-size:11px;color:var(--text-dim)}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;border:1px solid transparent;transition:all .18s;position:relative;cursor:pointer}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav a.active{color:var(--cyan);background:linear-gradient(90deg,rgba(0,229,255,.10),rgba(0,229,255,.01));border-color:rgba(0,229,255,.30)}
.nav a.active::before{content:'';position:absolute;right:-17px;top:8px;bottom:8px;width:3px;background:var(--cyan);border-radius:3px;box-shadow:0 0 12px var(--cyan)}
.nav-ico{width:22px;text-align:center;font-size:14px;opacity:.85}
.sidebar-foot{display:flex;flex-direction:column;gap:8px}
.year-badge{font-size:12px;color:var(--cyan);padding:8px 12px;border-radius:8px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.20);text-align:center}
.storage-badge{font-size:11px;padding:7px 12px;border-radius:8px;text-align:center;border:1px solid;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.storage-badge.local{color:var(--text-dim);background:rgba(255,255,255,.03);border-color:var(--border)}
.storage-badge.cloud{color:var(--green);background:rgba(0,255,157,.08);border-color:rgba(0,255,157,.30)}
.storage-badge.file{color:var(--yellow);background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.30)}
.storage-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.hint{font-size:10.5px;color:var(--text-mute);text-align:center}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:18px 30px;border-bottom:1px solid var(--border);background:rgba(6,9,16,.55);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.topbar h1{font-size:19px;font-weight:700;margin:0}
.topbar-actions{margin-right:auto;display:flex;gap:12px;align-items:center}
.search-wrap{position:relative}
.search-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-mute);font-size:16px;pointer-events:none}
.search-wrap input{width:290px;padding:10px 38px 10px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--border-2)}
.search-results{position:absolute;top:calc(100% + 8px);right:0;left:0;background:rgba(12,16,26,.98);border:1px solid var(--border-2);border-radius:12px;max-height:340px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:30}
.search-results.hidden{display:none}
.search-item{padding:11px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:rgba(0,229,255,.06)}
.view{padding:28px 30px 60px;flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;transition:all .18s;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.07)}
.btn-primary{background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(0,229,255,.04));border-color:rgba(0,229,255,.55);color:var(--cyan)}
.btn-danger{border-color:rgba(255,58,94,.5);color:#ff8ba3;background:rgba(255,58,94,.06)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px}
.only-mobile{display:none}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.card-title{font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:.4px;text-transform:uppercase;margin:0 0 16px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--cyan);border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative}
.stat::after{content:'';position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5}
.stat.s-mag::after{background:linear-gradient(90deg,transparent,var(--magenta),transparent)}
.stat.s-grn::after{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.stat.s-red::after{background:linear-gradient(90deg,transparent,var(--red),transparent)}
.stat-label{font-size:11.5px;color:var(--text-dim);margin-bottom:10px}
.stat-value{font-size:32px;font-weight:800;line-height:1}
.stat-sub{font-size:11px;color:var(--text-mute);margin-top:8px}
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:right;padding:13px 16px;font-weight:600;color:var(--text-dim);font-size:11.5px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:rgba(0,229,255,.035)}
tbody tr:last-child td{border-bottom:none}
.row-name{font-weight:600;cursor:pointer}
.row-name:hover{color:var(--cyan)}
.mono{font-family:Consolas,monospace;font-size:12px;color:var(--text-dim)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.pill-green{color:var(--green);background:rgba(0,255,157,.08);border-color:rgba(0,255,157,.30)}
.pill-cyan{color:var(--cyan);background:rgba(0,229,255,.08);border-color:rgba(0,229,255,.30)}
.pill-yellow{color:var(--yellow);background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.30)}
.pill-orange{color:var(--orange);background:rgba(255,140,26,.08);border-color:rgba(255,140,26,.30)}
.pill-red{color:var(--red);background:rgba(255,58,94,.08);border-color:rgba(255,58,94,.30)}
.pill-mag{color:var(--magenta);background:rgba(255,43,214,.08);border-color:rgba(255,43,214,.30)}
.pill-purple{color:var(--purple);background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.30)}
.pill-dim{color:var(--text-dim);background:rgba(255,255,255,.04);border-color:var(--border)}
.score-card{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:26px 30px;margin-bottom:24px}
.score-num{font-size:78px;font-weight:900;line-height:1;letter-spacing:-3px}
.score-num small{font-size:20px;font-weight:500;opacity:.6;margin-right:8px}
.score-meta{display:flex;flex-direction:column;gap:12px;min-width:0}
.score-label{font-size:12px;color:var(--text-dim)}
.progress{height:10px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.progress-fill{height:100%;border-radius:6px;transition:width .6s}
.progress-marks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-mute);margin-top:5px}
.station-card{padding:22px;border-radius:var(--r);border:1px solid var(--border-2);background:linear-gradient(160deg,rgba(0,229,255,.05),transparent 60%)}
.station-card h3{margin:0 0 4px;font-size:16px}
.station-card .thr{font-size:12px;color:var(--text-dim);margin-bottom:14px}
.station-actions{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.station-actions li{display:flex;gap:10px;font-size:13px;line-height:1.6;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border)}
.station-actions li::before{content:'▸';color:var(--cyan);font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal-mask{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:24px}
.modal{background:linear-gradient(160deg,rgba(14,18,30,.98),rgba(10,13,22,.98));border:1px solid var(--border-2);border-radius:18px;width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 100px rgba(0,0,0,.7)}
.modal.wide{width:min(900px,100%)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}
.modal-close{background:transparent;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px}
.modal-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
.modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;color:var(--text-dim)}
.field input,.field textarea,.field select{padding:10px 13px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus{border-color:var(--border-2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
.type-tile{padding:12px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.02);display:flex;justify-content:space-between;gap:10px;align-items:center;transition:all .15s;text-align:right}
.type-tile:hover{border-color:rgba(0,229,255,.35)}
.type-tile.selected{border-color:var(--cyan);background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(0,229,255,.02))}
.type-tile .tt-label{font-size:12.5px;line-height:1.5}
.type-tile .tt-pts{font-weight:800;font-size:15px;color:var(--cyan);background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);padding:4px 10px;border-radius:8px;white-space:nowrap}
.preview{padding:18px;border-radius:12px;background:linear-gradient(135deg,rgba(0,229,255,.06),rgba(255,43,214,.04));border:1px dashed rgba(0,229,255,.4);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center}
.preview .pv-item{display:flex;flex-direction:column;gap:4px}
.preview .pv-label{font-size:11px;color:var(--text-dim)}
.preview .pv-value{font-size:22px;font-weight:800;color:var(--cyan)}
.preview .pv-value.mag{color:var(--magenta)}
.empty{text-align:center;padding:60px 20px;color:var(--text-mute);border:1px dashed var(--border);border-radius:var(--r)}
.empty .e-ico{font-size:44px;opacity:.35;margin-bottom:10px}
.empty .e-txt{font-size:14px}
.ladder{display:flex;flex-direction:column;gap:14px}
.rung{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;padding:18px 22px;border-radius:14px;background:var(--panel);border:1px solid var(--border)}
.rung.active{border-color:var(--border-2)}
.rung .thr-big{font-size:26px;font-weight:900;text-align:center}
.rung h4{margin:0 0 4px;font-size:14.5px}
.rung p{margin:0;font-size:12px;color:var(--text-dim)}
.toast{position:fixed;bottom:26px;left:26px;padding:13px 20px;border-radius:12px;background:rgba(12,16,26,.98);border:1px solid var(--border-2);color:var(--text);font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.5);transform:translateY(120%);transition:transform .35s;z-index:200;max-width:420px}
.toast.show{transform:translateY(0)}
.toast.success{border-color:rgba(0,255,157,.5)}
.toast.error{border-color:rgba(255,58,94,.6)}
.mode-card{padding:16px 18px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;transition:all .18s;display:flex;gap:14px;align-items:flex-start}
.mode-card:hover{border-color:rgba(0,229,255,.3)}
.mode-card.selected{border-color:var(--cyan);background:linear-gradient(135deg,rgba(0,229,255,.10),rgba(0,229,255,.02))}
.mode-card .m-ico{font-size:22px;flex-shrink:0}
.mode-card .m-body{flex:1;min-width:0}
.mode-card h4{margin:0 0 4px;font-size:14px}
.mode-card p{margin:0;font-size:12px;color:var(--text-dim);line-height:1.6}
.cloud-status{padding:12px 14px;border-radius:10px;font-size:12px;display:flex;align-items:center;gap:10px;border:1px solid;flex-wrap:wrap}
.cloud-status.ok{color:var(--green);background:rgba(0,255,157,.06);border-color:rgba(0,255,157,.3)}
.cloud-status.warn{color:var(--yellow);background:rgba(255,214,10,.06);border-color:rgba(255,214,10,.3)}
.cloud-status.err{color:var(--red);background:rgba(255,58,94,.06);border-color:rgba(255,58,94,.3)}
#boot{position:fixed;inset:0;background:var(--bg);z-index:999;display:grid;place-items:center;color:var(--text);font-family:'Vazirmatn',sans-serif}
#boot .spin{width:44px;height:44px;border:3px solid rgba(0,229,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
#errBox{display:none;position:fixed;top:0;right:0;left:0;background:#ff3a5e;color:#fff;padding:14px 20px;font-family:'Vazirmatn',sans-serif;z-index:9999;font-size:13px;direction:rtl}
#updateBanner{display:none;position:fixed;top:0;right:0;left:0;background:linear-gradient(90deg,#00e5ff,#00ff9d);color:#04060c;padding:12px 20px;font-family:'Vazirmatn',sans-serif;z-index:9998;direction:rtl;font-weight:700;font-size:13px;align-items:center;gap:14px;justify-content:center;box-shadow:0 4px 20px rgba(0,229,255,.4)}
#updateBanner.show{display:flex}
#updateBanner button{background:#04060c;color:#00e5ff;border:none;padding:8px 16px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;right:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .only-mobile{display:inline-flex}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:16px}
  .view{padding:18px 16px 50px}
  .search-wrap input{width:170px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .score-card{grid-template-columns:1fr;text-align:center}
  .score-num{font-size:60px}
  .preview{grid-template-columns:1fr}
  .rung{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="errBox"></div>
<div id="updateBanner">
  <span>🚀 نسخه جدید آماده است</span>
  <button onclick="location.reload(true)">به‌روزرسانی</button>
</div>
<div id="boot"><div><div class="spin"></div><div>در حال بارگذاری…</div></div></div>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">آ</div>
      <div class="brand-text">
        <strong>انضباط هوشمند</strong>
        <span id="brandSchool">دبیرستان</span>
      </div>
    </div>
    <nav class="nav">
      <a data-route="dashboard"><span class="nav-ico">◈</span><span>داشبورد</span></a>
      <a data-route="students"><span class="nav-ico">◉</span><span>دانش‌آموزان</span></a>
      <a data-route="quick"><span class="nav-ico">✦</span><span>ثبت تخلف</span></a>
      <a data-route="stations"><span class="nav-ico">⚑</span><span>ایستگاه‌ها</span></a>
      <a data-route="import"><span class="nav-ico">📥</span><span>ورود از اکسل</span></a>
      <a data-route="settings"><span class="nav-ico">⚙</span><span>تنظیمات</span></a>
      <a data-route="backup"><span class="nav-ico">⤓</span><span>پشتیبان‌گیری</span></a>
    </nav>
    <div class="sidebar-foot">
      <div id="yearBadge" class="year-badge">سال تحصیلی —</div>
      <div class="storage-badge local" id="storageBadge" onclick="location.hash='#/settings'">
        <span class="dot"></span><span id="storageText">لوکال</span>
      </div>
      <div class="hint" id="verHint">نسخه ۴.۰.۲</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn">☰</button>
      <h1 id="pageTitle">داشبورد</h1>
      <div class="topbar-actions">
        <div class="search-wrap">
          <span class="search-ico">⌕</span>
          <input id="globalSearch" type="search" placeholder="جستجو (نام یا کد ملی)…" autocomplete="off">
          <div id="searchResults" class="search-results hidden"></div>
        </div>
        <button class="btn btn-primary" id="addStudentBtn">＋ دانش‌آموز جدید</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   ثابت‌ها
   ============================================================ */
var APP_VERSION = '4.0.2';
var STORAGE_KEY = 'sd-v3';
var BACKUP_KEY  = 'sd-backups-v3';
var CFG_KEY     = 'sd-cfg-v3';
var BIN_ID_KEY  = 'sd-binid';
var MAX_BACKUPS = 5;

function showError(msg){
  var el = document.getElementById('errBox');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = '⚠ خطا: ' + msg;
  setTimeout(function(){ el.style.display = 'none'; }, 8000);
}
window.addEventListener('error', function(e){ showError(e.message || String(e)); });
window.addEventListener('unhandledrejection', function(e){ showError(e.reason && e.reason.message || String(e.reason)); });

/* ============================================================
   تقویم شمسی
   ============================================================ */
var Jalali = (function(){
  var gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  function toJalali(gy, gm, gd){
    var jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;
    var gy2 = (gm > 2) ? (gy + 1) : gy;
    var days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
    jy += 33 * Math.floor(days/12053); days %= 12053;
    jy += 4 * Math.floor(days/1461); days %= 1461;
    if (days > 365){ jy += Math.floor((days-1)/365); days = (days-1) % 365; }
    var jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
    var jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
    return [jy, jm, jd];
  }
  var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function fa(n){ return String(n).replace(/\d/g, function(d){ return FA[+d]; }); }
  function fmt(iso, opts){
    opts = opts || {};
    if (!iso) return '—';
    var d = new Date(iso);
    var j = toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
    var date = fa(j[0])+'/'+fa(String(j[1]).padStart(2,'0'))+'/'+fa(String(j[2]).padStart(2,'0'));
    if (opts.dateOnly) return date;
    return date + ' — ' + fa(String(d.getHours()).padStart(2,'0')) + ':' + fa(String(d.getMinutes()).padStart(2,'0'));
  }
  function relative(iso){
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var min = Math.floor(diff/60000);
    if (min < 1) return 'همین حالا';
    if (min < 60) return fa(min) + ' دقیقه پیش';
    var h = Math.floor(min/60);
    if (h < 24) return fa(h) + ' ساعت پیش';
    var d = Math.floor(h/24);
    if (d < 30) return fa(d) + ' روز پیش';
    var mo = Math.floor(d/30);
    if (mo < 12) return fa(mo) + ' ماه پیش';
    return fa(Math.floor(mo/12)) + ' سال پیش';
  }
  return { toJalali:toJalali, fa:fa, fmt:fmt, relative:relative };
})();
var fa = Jalali.fa, fmt = Jalali.fmt, relative = Jalali.relative;

var IDB = {
  _db: null,
  open: function(){
    var self = this;
    if (self._db) return Promise.resolve(self._db);
    return new Promise(function(res, rej){
      if (!window.indexedDB){ rej(new Error('IndexedDB پشتیبانی نمی‌شود')); return; }
      var req = indexedDB.open('sd-h3', 1);
      req.onupgradeneeded = function(){ try { req.result.createObjectStore('h'); } catch(e){} };
      req.onsuccess = function(){ self._db = req.result; res(self._db); };
      req.onerror = function(){ rej(req.error); };
    });
  },
  set: function(k,v){ return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('h','readwrite'); tx.objectStore('h').put(v,k); tx.oncomplete=function(){res()}; tx.onerror=function(){rej(tx.error)}; }); }); },
  get: function(k){ return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('h','readonly'); var r=tx.objectStore('h').get(k); r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)}; }); }); },
  del: function(k){ return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('h','readwrite'); tx.objectStore('h').delete(k); tx.oncomplete=function(){res()}; tx.onerror=function(){rej(tx.error)}; }); }); }
};

function activeMode(){
  if (CFG.cloud && CFG.cloud.apiKey && CFG.cloud.binId) return 'cloud';
  if (fileHandle) return 'file';
  return 'local';
}

function normalizeDB(db){
  if (!db || typeof db !== 'object') return defaultDB();
  db.students = Array.isArray(db.students) ? db.students : [];
  db.violations = Array.isArray(db.violations) ? db.violations : [];
  db.violationTypes = Array.isArray(db.violationTypes) && db.violationTypes.length ? db.violationTypes : JSON.parse(JSON.stringify(DEFAULT_TYPES));
  db.stations = Array.isArray(db.stations) && db.stations.length ? db.stations : JSON.parse(JSON.stringify(DEFAULT_STATIONS));
  db.settings = db.settings || defaultDB().settings;
  db.meta = db.meta || { version:4 };
  return db;
}

function saveLocalBackup(db, tag){
  try {
    var backups = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]');
    var last = backups[0];
    if (!last || (last.meta && last.meta.lastModified) !== (db.meta && db.meta.lastModified) || tag){
      var clone = JSON.parse(JSON.stringify(db));
      clone._backedUpAt = new Date().toISOString();
      if (tag) clone._tag = tag;
      backups.unshift(clone);
      while (backups.length > MAX_BACKUPS) backups.pop();
      localStorage.setItem(BACKUP_KEY, JSON.stringify(backups));
    }
  } catch(e){}
}

function updateStorageBadge(){
  var badge = document.getElementById('storageBadge');
  var text  = document.getElementById('storageText');
  if (!badge || !text) return;
  var m = activeMode();
  var pending = DB && DB.meta && DB.meta.pendingSync;
  badge.className = 'storage-badge ' + m;
  var label;
  if (m === 'cloud'){
    if (pending) label = 'ابری — در صف';
    else if (cloudOnline) label = 'ابری — متصل';
    else label = 'ابری — قطع (محلی)';
  } else if (m === 'file'){
    label = pending ? 'فایل — خطا' : 'فایل روی دیسک';
  } else {
    label = 'لوکال (مرورگر)';
  }
  text.textContent = label;
}

function loadDB(){
  var mode = activeMode();
  var promise;
  if (mode === 'cloud'){
    promise = fetch('https://api.jsonbin.io/v3/b/'+CFG.cloud.binId+'/latest', { headers:{ 'X-Master-Key': CFG.cloud.apiKey } })
      .then(function(r){
        if (r.status === 401 || r.status === 403) throw new Error('کلید X-Master-Key نامعتبر (HTTP '+r.status+')');
        if (r.status === 404) throw new Error('Bin ID پیدا نشد (HTTP 404)');
        if (!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      })
      .then(function(j){
        cloudOnline = true;
        var remote = normalizeDB(j.record || j);
        var local = null;
        try { local = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch(e){}
        if (local && local.meta && local.meta.pendingSync){ DB = normalizeDB(local); }
        else { DB = remote; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){} }
      })
      .catch(function(e){
        cloudOnline = false;
        console.error('[loadDB cloud]', e.message);
        try { DB = normalizeDB(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
        catch(x){ DB = defaultDB(); }
      });
  } else if (mode === 'file' && fileHandle){
    promise = fileHandle.queryPermission({ mode:'readwrite' })
      .then(function(p){ if (p === 'granted') return; return fileHandle.requestPermission({ mode:'readwrite' }).then(function(p2){ if (p2 !== 'granted') throw new Error('اجازه داده نشد'); }); })
      .then(function(){ return fileHandle.getFile(); })
      .then(function(f){ return f.text(); })
      .then(function(text){ DB = (text && text.trim()) ? normalizeDB(JSON.parse(text)) : defaultDB(); })
      .catch(function(){ try { DB = normalizeDB(JSON.parse(localStorage.getItem(STORAGE_KEY))); } catch(x){ DB = defaultDB(); } });
  } else {
    promise = Promise.resolve().then(function(){
      try { DB = normalizeDB(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
      catch(e){ DB = defaultDB(); }
    });
  }
  return promise.then(function(){ if (!DB) DB = defaultDB(); });
}

function pushToCloud(){
  if (!CFG.cloud || !CFG.cloud.binId || !CFG.cloud.apiKey) return Promise.resolve(false);
  return fetch('https://api.jsonbin.io/v3/b/'+CFG.cloud.binId, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': CFG.cloud.apiKey },
    body: JSON.stringify(DB)
  }).then(function(r){ cloudOnline = r.ok; return r.ok; })
    .catch(function(){ cloudOnline = false; return false; });
}

function saveDB(){
  if (!DB) return Promise.resolve();
  DB.meta = DB.meta || {};
  DB.meta.lastModified = new Date().toISOString();
  DB.meta.lastModifiedBy = CFG.userName || '';

  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){}
  saveLocalBackup(DB);

  var mode = activeMode();
  if (mode === 'cloud'){
    return pushToCloud().then(function(ok){
      DB.meta.pendingSync = !ok;
      if (!ok) toast('اینترنت قطع — داده محلی ذخیره شد', 'info');
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){}
      updateStorageBadge();
    });
  }
  if (mode === 'file' && fileHandle){
    return fileHandle.createWritable()
      .then(function(w){ return w.write(JSON.stringify(DB,null,2)).then(function(){ return w.close(); }); })
      .then(function(){ DB.meta.pendingSync = false; updateStorageBadge(); })
      .catch(function(e){ DB.meta.pendingSync = true; toast('خطای فایل: '+e.message,'error'); updateStorageBadge(); });
  }
  DB.meta.pendingSync = false;
  updateStorageBadge();
  return Promise.resolve();
}

/* ============================================================
   همگام‌سازی ابری
   ============================================================ */
function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  if (activeMode() !== 'cloud') return;
  pollTimer = setInterval(function(){ pullFromCloud(false); }, 10000);
}

function pullFromCloud(silent){
  if (activeMode() !== 'cloud') return Promise.resolve();
  if (DB && DB.meta && DB.meta.pendingSync){
    return pushToCloud().then(function(ok){
      if (ok){
        DB.meta.pendingSync = false;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){}
        if (!silent) toast('همگام شد','success');
      }
      updateStorageBadge();
    });
  }
  return fetch('https://api.jsonbin.io/v3/b/'+CFG.cloud.binId+'/latest', { headers:{ 'X-Master-Key': CFG.cloud.apiKey } })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      cloudOnline = true;
      var remote = normalizeDB(j.record || j);
      if (remote.meta && DB.meta && remote.meta.lastModified !== DB.meta.lastModified){
        DB = remote;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){}
        if (!silent){ render(); toast('داده‌ها از دستگاه دیگری به‌روز شد', 'info'); }
      }
      updateStorageBadge();
    })
    .catch(function(){ cloudOnline = false; updateStorageBadge(); });
}

/* ============================================================
   منطق آیین‌نامه
   ============================================================ */
function applyAutoReset(){
  if (!DB) return false;
  var months = Number(DB.settings.resetMonths) || 2;
  var resetMs = months * 30 * 24 * 60 * 60 * 1000;
  var now = Date.now();
  var groups = {};
  DB.violations.forEach(function(v){
    if (v.archived) return;
    var key = v.studentId + '|' + v.typeId;
    if (!groups[key]) groups[key] = [];
    groups[key].push(v);
  });
  var changed = false;
  for (var k in groups){
    var list = groups[k];
    var latest = Math.max.apply(null, list.map(function(x){ return new Date(x.occurredAt).getTime(); }));
    if (now - latest > resetMs){
      list.forEach(function(x){ x.archived = true; x.archivedAt = new Date().toISOString(); x.archiveReason = 'auto-reset'; });
      changed = true;
    }
  }
  return changed;
}

function yearStartMs(){ return DB.settings.yearStartISO ? new Date(DB.settings.yearStartISO).getTime() : 0; }
function activeViolationsOf(sid){
  var ys = yearStartMs();
  return DB.violations.filter(function(v){ return v.studentId === sid && !v.archived && new Date(v.occurredAt).getTime() >= ys; })
    .sort(function(a,b){ return new Date(b.occurredAt) - new Date(a.occurredAt); });
}
function totalPointsOf(sid){ return activeViolationsOf(sid).reduce(function(s,v){ return s + v.pointsApplied; }, 0); }
function typeCountsOf(sid){
  var m = {};
  activeViolationsOf(sid).forEach(function(v){ m[v.typeId] = (m[v.typeId]||0)+1; });
  return m;
}
function countPriorOccurrences(sid, tid){ return typeCountsOf(sid)[tid] || 0; }
function multiplierFor(prior){
  var k = prior + 1;
  if (k <= 2) return 1;
  if (k <= 4) return 2;
  if (k <= 6) return 3;
  return 4;
}
function currentStation(points){
  var cur = null; DB.stations.forEach(function(s){ if (points >= s.threshold) cur = s; }); return cur;
}
function nextStation(points){
  for (var i=0;i<DB.stations.length;i++) if (points < DB.stations[i].threshold) return DB.stations[i];
  return null;
}
function scoreColor(p){
  if (p===0) return 'var(--green)';
  if (p<15) return 'var(--cyan)';
  if (p<30) return 'var(--yellow)';
  if (p<45) return 'var(--orange)';
  if (p<65) return 'var(--red)';
  if (p<80) return '#ff1f4d';
  if (p<100) return 'var(--magenta)';
  return 'var(--purple)';
}
function scorePillClass(p){
  if (p===0) return 'pill-green';
  if (p<15) return 'pill-cyan';
  if (p<30) return 'pill-yellow';
  if (p<45) return 'pill-orange';
  if (p<65) return 'pill-red';
  if (p<80) return 'pill-red';
  if (p<100) return 'pill-mag';
  return 'pill-purple';
}

  root.innerHTML = '<div class="modal-mask" id="modalMask"><div class="modal '+(opts.wide?'wide':'')+'"><div class="modal-head"><h3>'+esc(opts.title)+'</h3><button class="modal-close" id="modalClose">✕</button></div><div class="modal-body">'+opts.body+'</div>'+(opts.footer?'<div class="modal-foot">'+opts.footer+'</div>':'')+'</div></div>';
  var close = function(){ root.innerHTML = ''; };
  document.getElementById('modalClose').onclick = close;
  document.getElementById('modalMask').onclick = function(e){ if (e.target.id === 'modalMask') close(); };
  return { close: close, root: root };
}

/* ============================================================
   Router
   ============================================================ */
function getRoute(){
  var h = location.hash.replace(/^#\/?/, ''); var p = h.split('/');
  return { route: p[0] || 'dashboard', param: p[1] };
}
function navigate(r, p){ location.hash = p ? '#/'+r+'/'+p : '#/'+r; }

function render(){
  if (!DB){ var v = document.getElementById('view'); if (v) v.innerHTML = '<div class="empty">در حال بارگذاری…</div>'; return; }
  if (applyAutoReset()) saveDB();
  var r = getRoute();
  $$('.nav a').forEach(function(a){ a.classList.toggle('active', a.dataset.route === r.route); });
  var titles = { dashboard:'داشبورد', students:'دانش‌آموزان', student:'پرونده دانش‌آموز', quick:'ثبت تخلف', stations:'ایستگاه‌های تنبیهی', import:'ورود گروهی از اکسل', settings:'تنظیمات', backup:'پشتیبان‌گیری' };
  document.getElementById('pageTitle').textContent = titles[r.route] || 'داشبورد';
  document.getElementById('brandSchool').textContent = DB.settings.schoolName || 'دبیرستان';
  document.getElementById('yearBadge').textContent = 'سال تحصیلی ' + (DB.settings.academicYear || '—');
  document.getElementById('sidebar').classList.remove('open');
  updateStorageBadge();

  if (r.route === 'student' && r.param) return renderStudentDetail(r.param);
  if (r.route === 'quick' && r.param){ quickSelection.studentId = r.param; return renderQuick(); }
  var views = { dashboard:renderDashboard, students:renderStudents, quick:renderQuick, stations:renderStations, import:renderImport, settings:renderSettings, backup:renderBackup };
  (views[r.route] || renderDashboard)();
}

/* ============================================================
   Dashboard
   ============================================================ */
function renderDashboard(){
  var totalStudents = DB.students.length;
  var activeVios = DB.violations.filter(function(v){ return !v.archived; }).length;
  var inDanger = DB.students.filter(function(s){ return totalPointsOf(s.id) >= 15; }).length;
  var topScore = DB.students.reduce(function(m,s){ return Math.max(m, totalPointsOf(s.id)); }, 0);
  var dist = DB.stations.map(function(st){ return Object.assign({}, st, { count: DB.students.filter(function(s){ var c = currentStation(totalPointsOf(s.id)); return c && c.id === st.id; }).length }); });
  var recent = DB.violations.slice().sort(function(a,b){ return new Date(b.occurredAt) - new Date(a.occurredAt); }).slice(0,8);

  var html = '<div class="stats">'
    + '<div class="stat"><div class="stat-label">دانش‌آموزان</div><div class="stat-value">'+fa(totalStudents)+'</div><div class="stat-sub">ثبت‌شده</div></div>'
    + '<div class="stat s-mag"><div class="stat-label">تخلفات فعال</div><div class="stat-value" style="color:var(--magenta)">'+fa(activeVios)+'</div><div class="stat-sub">سال جاری</div></div>'
    + '<div class="stat s-red"><div class="stat-label">در خطر</div><div class="stat-value" style="color:var(--red)">'+fa(inDanger)+'</div><div class="stat-sub">امتیاز ≥ ۱۵</div></div>'
    + '<div class="stat s-grn"><div class="stat-label">بیشترین امتیاز</div><div class="stat-value" style="color:var(--green)">'+fa(topScore)+'</div><div class="stat-sub">کل مدرسه</div></div>'
    + '</div>';

  html += '<div class="grid-2"><div class="card"><h3 class="card-title">توزیع ایستگاه‌ها</h3><div class="ladder">';
  dist.forEach(function(st){
    html += '<div class="rung '+(st.count?'active':'')+'">'
      + '<div class="thr-big" style="color:'+scoreColor(st.threshold)+'">−'+fa(st.threshold)+'</div>'
      + '<div><h4>'+esc(st.name)+'</h4><p>'+esc(st.sports)+'</p></div>'
      + '<div class="pill '+(st.count?'pill-cyan':'pill-dim')+'">'+fa(st.count)+' نفر</div></div>';
  });
  html += '</div></div>';

  html += '<div class="card"><h3 class="card-title">آخرین تخلفات</h3>';
  if (recent.length){
    html += '<div style="display:flex;flex-direction:column;gap:10px">';
    recent.forEach(function(v){
      var st = DB.students.filter(function(s){ return s.id === v.studentId; })[0];
      var ty = DB.violationTypes.filter(function(t){ return t.id === v.typeId; })[0];
      if (!st || !ty) return;
      html += '<div style="display:flex;justify-content:space-between;gap:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--border)">'
        + '<div style="min-width:0"><div style="font-weight:600;font-size:13px;cursor:pointer" onclick="navigate(\'student\',\''+st.id+'\')">'+esc(fullName(st))+'</div>'
        + '<div style="font-size:11.5px;color:var(--text-dim);margin-top:3px">'+esc(ty.label)+'</div>'
        + '<div style="font-size:10.5px;color:var(--text-mute);margin-top:4px">'+relative(v.occurredAt)+' · '+fmt(v.occurredAt)+'</div></div>'
        + '<div style="text-align:left"><div style="font-weight:800;font-size:18px;color:'+(v.multiplier>1?'var(--magenta)':'var(--cyan)')+'">−'+fa(v.pointsApplied)+'</div>'
        + (v.multiplier>1?'<div style="font-size:10px;color:var(--text-dim)">×'+fa(v.multiplier)+'</div>':'')+'</div></div>';
    });
    html += '</div>';
  } else html += '<div class="empty"><div class="e-ico">◌</div><div class="e-txt">هنوز تخلفی ثبت نشده</div></div>';
  html += '</div></div>';
  document.getElementById('view').innerHTML = html;
}

/* ============================================================
   Students list
   ============================================================ */
function renderStudents(){
  var list = DB.students.slice().sort(function(a,b){ return totalPointsOf(b.id) - totalPointsOf(a.id); });
  var grades = []; DB.students.forEach(function(s){ if (s.grade && grades.indexOf(s.grade) < 0) grades.push(s.grade); }); grades.sort();

  var html = '<div class="card" style="margin-bottom:20px"><div class="row">'
    + '<input id="filterInput" placeholder="جستجو…" style="flex:1;min-width:200px;padding:11px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;outline:none">'
    + '<select id="gradeFilter" style="padding:11px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;outline:none"><option value="">همه پایه‌ها</option>'
    + grades.map(function(g){ return '<option>'+esc(g)+'</option>'; }).join('') + '</select>'
    + '<button class="btn" id="goImportBtn" style="margin-right:auto">📥 ورود از اکسل</button></div></div>';

  if (list.length){
    html += '<div class="table-wrap"><table><thead><tr><th>نام</th><th>کد ملی</th><th>کلاس</th><th>امتیاز</th><th>ایستگاه</th><th>آخرین تخلف</th><th></th></tr></thead><tbody id="studentsTbody"></tbody></table></div>';
  } else html += '<div class="empty"><div class="e-ico">◉</div><div class="e-txt">هنوز دانش‌آموزی ثبت نشده</div></div>';
  document.getElementById('view').innerHTML = html;

  var tbody = document.getElementById('studentsTbody');
  if (tbody){
    var apply = function(){
      var q = document.getElementById('filterInput').value.trim().toLowerCase();
      var g = document.getElementById('gradeFilter').value;
      var filtered = list.filter(function(s){
        if (g && s.grade !== g) return false;
        if (!q) return true;
        return (fullName(s)+' '+s.nationalId+' '+(s.className||'')).toLowerCase().indexOf(q) >= 0;
      });
      tbody.innerHTML = filtered.map(studentRow).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-mute);padding:30px">نتیجه‌ای یافت نشد</td></tr>';
    };
    document.getElementById('filterInput').addEventListener('input', apply);
    document.getElementById('gradeFilter').addEventListener('change', apply);
    apply();
  }
  if (document.getElementById('goImportBtn')) document.getElementById('goImportBtn').onclick = function(){ navigate('import'); };
}

function studentRow(s){
  var pts = totalPointsOf(s.id);
  var cur = currentStation(pts);
  var viols = activeViolationsOf(s.id);
  var last = viols[0];
  return '<tr>'
    + '<td><span class="row-name" onclick="navigate(\'student\',\''+s.id+'\')">'+esc(fullName(s))+'</span></td>'
    + '<td class="mono">'+esc(s.nationalId || '—')+'</td>'
    + '<td>'+esc(s.className||'—')+(s.classType?' / '+esc(s.classType):'')+'</td>'
    + '<td><span class="pill '+scorePillClass(pts)+'" style="font-size:13px;font-weight:800;padding:5px 12px">−'+fa(pts)+'</span></td>'
    + '<td>'+(cur ? '<span class="pill pill-mag">'+esc(cur.name.split('—')[0].trim())+'</span>' : '<span class="pill pill-green">پاک</span>')+'</td>'
    + '<td style="color:var(--text-dim);font-size:12px">'+(last ? relative(last.occurredAt) : '—')+'</td>'
    + '<td><button class="btn btn-sm" onclick="navigate(\'student\',\''+s.id+'\')">مشاهده</button></td></tr>';
}

/* ============================================================
   Student detail
   ============================================================ */
function renderStudentDetail(id){
  var s = DB.students.filter(function(x){ return x.id === id; })[0];
  if (!s){ document.getElementById('view').innerHTML = '<div class="empty">دانش‌آموز یافت نشد</div>'; return; }
  var pts = totalPointsOf(s.id);
  var cur = currentStation(pts);
  var nxt = nextStation(pts);
  var viols = activeViolationsOf(s.id);
  var tcounts = typeCountsOf(s.id);
  var prevThr = cur ? cur.threshold : 0;
  var nextThr = nxt ? nxt.threshold : Math.max(pts, 100);
  var pct = nextThr > prevThr ? Math.min(100, ((pts - prevThr)/(nextThr - prevThr))*100) : 100;

  var html = '<div class="row" style="margin-bottom:16px">'
    + '<button class="btn btn-ghost btn-sm" onclick="navigate(\'students\')">→ بازگشت</button>'
    + '<button class="btn btn-sm" id="editStudentBtn">✎ ویرایش</button>'
    + '<button class="btn btn-primary btn-sm" id="quickForStudentBtn">✦ ثبت تخلف</button>'
    + '<button class="btn btn-danger btn-sm" id="deleteStudentBtn" style="margin-right:auto">حذف</button></div>';

  var meta = [];
  if (s.studentNumber) meta.push('شماره: '+esc(s.studentNumber));
  if (s.nationalId) meta.push('کد ملی: '+esc(s.nationalId));
  if (s.grade) meta.push('پایه: '+esc(s.grade));
  if (s.className) meta.push('کلاس: '+esc(s.className));
  if (s.classType) meta.push(esc(s.classType));

  var contacts = [];
  if (s.parentPhone) contacts.push('<span>📞 پدر: '+esc(s.parentPhone)+'</span>');
  if (s.motherPhone) contacts.push('<span>📞 مادر: '+esc(s.motherPhone)+'</span>');
  if (s.studentPhone) contacts.push('<span>📱 دانش‌آموز: '+esc(s.studentPhone)+'</span>');
  if (s.address) contacts.push('<span>📍 '+esc(s.address)+'</span>');

  html += '<div class="card score-card" style="border-color:'+scoreColor(pts)+'33">'
    + '<div class="score-num" style="color:'+scoreColor(pts)+'">−'+fa(pts)+'<small>امتیاز</small></div>'
    + '<div class="score-meta"><div class="score-label">'+esc(fullName(s))+(meta.length?' · '+meta.join(' · '):'')+'</div>'
    + '<div class="progress"><div class="progress-fill" style="width:'+pct+'%;background:linear-gradient(90deg,var(--cyan),'+scoreColor(pts)+')"></div></div>'
    + '<div class="progress-marks"><span>'+(cur?esc(cur.name):'بدون ایستگاه')+'</span><span>'+(nxt ? 'ایستگاه بعدی: −'+fa(nxt.threshold) : 'بالاترین ایستگاه')+'</span></div>'
    + (contacts.length?'<div style="font-size:11.5px;color:var(--text-dim);display:flex;gap:16px;flex-wrap:wrap;margin-top:4px">'+contacts.join('')+'</div>':'')
    + '</div></div>';

  html += '<div class="grid-2"><div class="stack"><div class="card"><h3 class="card-title">تفکیک تخلفات</h3>';
  var keys = Object.keys(tcounts);
  if (keys.length){
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    DB.violationTypes.forEach(function(t){
      var c = tcounts[t.id] || 0; if (!c) return;
      var nm = multiplierFor(c);
      var sum = viols.filter(function(v){ return v.typeId === t.id; }).reduce(function(a,v){ return a + v.pointsApplied; }, 0);
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;gap:10px">'
        + '<div style="min-width:0"><div style="font-size:12.5px">'+esc(t.label)+'</div>'
        + '<div style="font-size:11px;color:var(--text-dim);margin-top:3px">'+fa(c)+' بار · پایه −'+fa(t.points)+' · بعدی ×'+fa(nm)+'</div></div>'
        + '<div style="font-weight:800;color:var(--magenta);font-size:15px">−'+fa(sum)+'</div></div>';
    });
    html += '</div>';
  } else html += '<div style="color:var(--text-mute);font-size:13px">هیچ تخلف فعالی نیست</div>';
  html += '</div>';

  if (cur){
    html += '<div class="station-card" style="border-color:'+scoreColor(pts)+'77"><h3 style="color:'+scoreColor(pts)+'">'+esc(cur.name)+'</h3>'
      + '<div class="thr">حدنصاب: −'+fa(cur.threshold)+' · ورزش/اردو: '+esc(cur.sports)+'</div>'
      + '<ul class="station-actions">'+cur.actions.map(function(a){ return '<li>'+esc(a)+'</li>'; }).join('')+'</ul></div>';
  } else {
    html += '<div class="station-card" style="border-color:rgba(0,255,157,.3)"><h3 style="color:var(--green)">وضعیت پاک</h3><div class="thr">تبریک!</div></div>';
  }
  html += '</div>';

  html += '<div class="card"><h3 class="card-title">سابقه ('+fa(viols.length)+')</h3>';
  if (viols.length){
    html += '<div style="display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto">';
    viols.forEach(function(v){
      var t = DB.violationTypes.filter(function(x){ return x.id === v.typeId; })[0];
      html += '<div style="padding:12px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--border)">'
        + '<div style="display:flex;justify-content:space-between;gap:12px">'
        + '<div style="min-width:0"><div style="font-size:12.5px;font-weight:600">'+esc(t?t.label:'—')+'</div>'
        + '<div style="font-size:11px;color:var(--text-dim);margin-top:4px">'+fmt(v.occurredAt)+'</div>'
        + (v.note?'<div style="font-size:11.5px;color:var(--text-mute);margin-top:5px;font-style:italic">«'+esc(v.note)+'»</div>':'')+'</div>'
        + '<div style="text-align:left"><div style="font-weight:800;font-size:16px;color:'+(v.multiplier>1?'var(--magenta)':'var(--cyan)')+'">−'+fa(v.pointsApplied)+'</div>'
        + (v.multiplier>1?'<div style="font-size:10px;color:var(--text-dim)">'+fa(v.basePoints)+'×'+fa(v.multiplier)+'</div>':'')
        + '<button class="btn btn-sm btn-danger" style="margin-top:6px" onclick="undoViolation(\''+v.id+'\')">حذف</button></div></div></div>';
    });
    html += '</div>';
  } else html += '<div style="color:var(--text-mute);font-size:13px">سابقه‌ای نیست</div>';
  html += '</div></div>';
  document.getElementById('view').innerHTML = html;

  document.getElementById('editStudentBtn').onclick = function(){ openStudentForm(s); };
  document.getElementById('quickForStudentBtn').onclick = function(){ navigate('quick', s.id); };
  document.getElementById('deleteStudentBtn').onclick = function(){
    if (!confirm('دانش‌آموز «'+fullName(s)+'» و سوابقش حذف شوند؟')) return;
    DB.students = DB.students.filter(function(x){ return x.id !== s.id; });
    DB.violations = DB.violations.filter(function(v){ return v.studentId !== s.id; });
    saveDB().then(function(){ toast('حذف شد','success'); navigate('students'); });
  };
}

function undoViolation(id){
  if (!confirm('این تخلف حذف شود؟')) return;
  DB.violations = DB.violations.filter(function(v){ return v.id !== id; });
  saveDB().then(function(){ toast('حذف شد','success'); render(); });
}

/* ============================================================
   Quick log
   ============================================================ */
function renderQuick(){
  var pre = quickSelection.studentId;
  var selectedStudent = pre ? DB.students.filter(function(s){ return s.id === pre; })[0] : null;
  var selectedType = quickSelection.typeId ? DB.violationTypes.filter(function(t){ return t.id === quickSelection.typeId; })[0] : null;
  var previewHTML = '';
  if (selectedStudent && selectedType){
    var prior = countPriorOccurrences(selectedStudent.id, selectedType.id);
    var mult = multiplierFor(prior);
    var applied = selectedType.points * mult;
    previewHTML = '<div class="preview">'
      + '<div class="pv-item"><span class="pv-label">این چندمین بار</span><span class="pv-value">'+fa(prior+1)+'</span></div>'
      + '<div class="pv-item"><span class="pv-label">ضریب</span><span class="pv-value '+(mult>1?'mag':'')+'">×'+fa(mult)+'</span></div>'
      + '<div class="pv-item"><span class="pv-label">امتیاز نهایی</span><span class="pv-value '+(mult>1?'mag':'')+'">−'+fa(applied)+'</span></div></div>';
  }
  var html = '<div class="grid-2"><div class="stack"><div class="card"><h3 class="card-title">۱. دانش‌آموز</h3>';
  if (selectedStudent){
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:10px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.3);gap:10px">'
      + '<div style="min-width:0"><div style="font-weight:600">'+esc(fullName(selectedStudent))+'</div>'
      + '<div style="font-size:11.5px;color:var(--text-dim);margin-top:3px">'+esc(selectedStudent.className||'—')+' · امتیاز −'+fa(totalPointsOf(selectedStudent.id))+'</div></div>'
      + '<button class="btn btn-sm" id="changeStudent">تغییر</button></div>';
  } else {
    html += '<div class="field"><label>جستجو…</label><input id="qStudent" placeholder="نام یا کد ملی…" autocomplete="off"><div id="qStudentList" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto"></div></div>';
  }
  html += '</div><div class="card"><h3 class="card-title">۲. نوع تخلف</h3><div class="type-grid">';
  DB.violationTypes.forEach(function(t){
    html += '<div class="type-tile '+(quickSelection.typeId===t.id?'selected':'')+'" data-type="'+t.id+'"><div class="tt-label">'+esc(t.label)+'</div><div class="tt-pts">−'+fa(t.points)+'</div></div>';
  });
  html += '</div></div></div>';
  html += '<div class="stack"><div class="card"><h3 class="card-title">۳. پیش‌نمایش</h3>'+(previewHTML || '<div style="color:var(--text-mute);font-size:13px">انتخاب کن…</div>')+'</div>';
  if (selectedStudent && selectedType){
    html += '<div class="card"><h3 class="card-title">۴. تاریخ و یادداشت</h3>'
      + '<div class="field"><label>تاریخ</label><input type="datetime-local" id="qWhen"></div>'
      + '<div class="field" style="margin-top:12px"><label>یادداشت</label><textarea id="qNote"></textarea></div>'
      + '<button class="btn btn-primary" id="qSubmit" style="margin-top:16px;width:100%;justify-content:center;padding:13px">ثبت تخلف</button></div>';
  }
  html += '</div></div>';
  document.getElementById('view').innerHTML = html;

  if (!selectedStudent){
    var q = document.getElementById('qStudent'), list = document.getElementById('qStudentList');
    var renderList = function(){
      var v = q.value.trim().toLowerCase();
      var items = DB.students.filter(function(s){ return !v || (fullName(s)+' '+s.nationalId).toLowerCase().indexOf(v) >= 0; }).slice(0, 30);
      list.innerHTML = items.map(function(s){ return '<div class="search-item" data-sid="'+s.id+'"><span>'+esc(fullName(s))+'</span><span style="color:var(--text-mute);font-size:11px">−'+fa(totalPointsOf(s.id))+'</span></div>'; }).join('') || '<div style="color:var(--text-mute);font-size:12.5px;padding:8px">موردی یافت نشد</div>';
      $$('[data-sid]', list).forEach(function(el){ el.onclick = function(){ quickSelection.studentId = el.dataset.sid; renderQuick(); }; });
    };
    q.addEventListener('input', renderList); renderList(); q.focus();
  } else {
    document.getElementById('changeStudent').onclick = function(){ quickSelection.studentId = null; renderQuick(); };
  }
  $$('[data-type]').forEach(function(el){ el.onclick = function(){ quickSelection.typeId = el.dataset.type; renderQuick(); }; });
  var whenInput = document.getElementById('qWhen');
  if (whenInput && !whenInput.value){
    var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    whenInput.value = d.toISOString().slice(0,16);
  }
  var sub = document.getElementById('qSubmit');
  if (sub) sub.onclick = function(){
    var when = whenInput.value ? new Date(whenInput.value).toISOString() : new Date().toISOString();
    var prior = countPriorOccurrences(selectedStudent.id, selectedType.id);
    var mult = multiplierFor(prior);
    DB.violations.push({ id: uid('vio'), studentId: selectedStudent.id, typeId: selectedType.id, occurredAt: when, note: document.getElementById('qNote').value.trim(), priorCount: prior, occurrenceNumber: prior + 1, basePoints: selectedType.points, multiplier: mult, pointsApplied: selectedType.points * mult, archived: false, createdAt: new Date().toISOString() });
    saveDB().then(function(){
      toast('ثبت شد — '+fa(selectedType.points*mult)+'− (×'+fa(mult)+')', 'success');
      quickSelection = { studentId:null, typeId:null };
      navigate('student', selectedStudent.id);
    });
  };
}

/* ============================================================
   Stations
   ============================================================ */
function renderStations(){
  var nextThr = function(thr){ for (var i=0;i<DB.stations.length;i++) if (DB.stations[i].threshold > thr) return DB.stations[i].threshold; return Infinity; };
  var html = '<div style="margin-bottom:20px;color:var(--text-dim);font-size:13px">با تجمیع امتیازات منفی، هر ایستگاه خودکار فعال می‌شود.</div><div class="ladder">';
  DB.stations.forEach(function(st){

function sdParseDelimited(text, forced){
  text = String(text || '').replace(/^\uFEFF/, '');
  var delim = forced;
  if (!delim){
    var fl = (text.split(/\r?\n/)[0] || '');
    var t = (fl.match(/\t/g)||[]).length, c = (fl.match(/,/g)||[]).length, s = (fl.match(/;/g)||[]).length;
    delim = (t > c && t > s) ? '\t' : (s > c ? ';' : ',');
  }
  var rows = [], row = [], cell = '', inQ = false;
  for (var i=0;i<text.length;i++){
    var ch = text[i];
    if (inQ){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else inQ = false; } else cell += ch; }
    else { if (ch === '"') inQ = true; else if (ch === delim){ row.push(cell); cell=''; } else if (ch === '\r'){} else if (ch === '\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else cell += ch; }
  }
  if (cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim() !== ''; }); });
}

var _sdSheetJSPromise = null;
function sdLoadSheetJS(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_sdSheetJSPromise) return _sdSheetJSPromise;
  _sdSheetJSPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function(){ resolve(window.XLSX); };
    s.onerror = function(){ reject(new Error('بارگذاری کتابخانه اکسل ناموفق')); };
    document.head.appendChild(s);
  });
  return _sdSheetJSPromise;
}

var SD_ALIASES = {
  studentNumber:['شماره دانش آموزی','شماره دانش‌آموزی','شماره دانش اموزی','کد دانش آموزی','student number','studentnumber'],
  firstName:['نام','first name','firstname'],
  lastName:['نام خانوادگی','نام‌خانوادگی','فامیل','last name','lastname','family'],
  nationalId:['کد ملی','کدملی','شماره ملی','national id','nationalid'],
  className:['کلاس','کلاس درس','class','classname'],
  grade:['پایه','پایه تحصیلی','grade','level'],
  classType:['نوع ثبت نام کلاس','نوع ثبت‌نام کلاس','نوع ثبت نام','class type'],
  parentPhone:['شماره همراه پدر','همراه پدر','تلفن پدر','father phone','parent phone'],
  motherPhone:['شماره همراه مادر','همراه مادر','تلفن مادر','mother phone'],
  studentPhone:['شماره همراه دانش‌آموز','شماره همراه','phone'],
  notes:['یادداشت','توضیحات','note','notes']
};
function sdNorm(h){ return String(h==null?'':h).trim().toLowerCase().replace(/\u200c/g,' ').replace(/\s+/g,' '); }
function sdDetectMapping(hr){
  if (!hr) return null;
  var map = {};
  hr.forEach(function(h, i){
    var n = sdNorm(h); if (!n) return;
    for (var key in SD_ALIASES){
      if (map[key] != null) continue;
      var al = SD_ALIASES[key];
      for (var j=0;j<al.length;j++){
        var na = sdNorm(al[j]);
        if (na === n){ map[key] = i; break; }
        if (na.length >= 4 && (n.indexOf(na) >= 0 || na.indexOf(n) >= 0)){ map[key] = i; break; }
      }
    }
  });
  return map;
}
function sdLooksLikeHeader(row){
  if (!row || !row.length) return false;
  var j = row.map(sdNorm).join(' | ');
  return /نام|کد ملی|کلاس|دانش|شماره|phone|name|class|national/i.test(j);
}

function _sdProcess(m){
  var rows = _sdState.rows;
  if (!rows.length){ m.root.querySelector('#sdStatus').textContent = 'داده‌ای یافت نشد'; return; }
  var headerRow = null, dataStart = 0;
  if (sdLooksLikeHeader(rows[0])){ headerRow = rows[0]; dataStart = 1; }
  var mapping = headerRow ? sdDetectMapping(headerRow) : null;
  if (!mapping || Object.keys(mapping).length < 2){
    mapping = { studentNumber:0, firstName:1, lastName:2, nationalId:3, className:4, classType:5, parentPhone:6, motherPhone:7 };
  }
  var students = [];
  for (var i = dataStart; i < rows.length; i++){
    var r = rows[i];
    var g = function(k){ var idx = mapping[k]; if (idx == null) return ''; return String(r[idx] == null ? '' : r[idx]).trim(); };
    var stu = {
      studentNumber: g('studentNumber'), firstName: g('firstName'), lastName: g('lastName'),
      nationalId: g('nationalId') || g('studentNumber'), className: g('className'),
      grade: g('grade'), classType: g('classType'), parentPhone: g('parentPhone'), motherPhone: g('motherPhone')
    };
    if (!stu.firstName && !stu.lastName) continue;
    students.push(stu);
  }
  _sdState.students = students;
  var area = m.root.querySelector('#sdPreviewArea');
  var body = m.root.querySelector('#sdPreviewBody');
  var info = m.root.querySelector('#sdMappingInfo');
  var present = Object.keys(mapping).filter(function(k){ return mapping[k] != null; });
  var hd = headerRow ? present.map(function(k){ return '<b>'+esc(headerRow[mapping[k]] || k)+'</b> ← '+k; }).join(' · ') : present.map(function(k){ return k+'=ستون '+fa(mapping[k]+1); }).join(' · ');
  info.innerHTML = '📌 هدر: '+(headerRow?'شناسایی شد':'پیش‌فرض')+'<br>نگاشت: '+hd+'<br>تعداد: <b>'+fa(students.length)+'</b>';
  body.innerHTML = students.slice(0, 100).map(function(s, i){
    var ok = (s.firstName || s.lastName);
    return '<tr><td>'+fa(i+1)+'</td><td>'+(esc(s.firstName)||'—')+'</td><td>'+(esc(s.lastName)||'—')+'</td>'
      + '<td class="mono">'+(esc(s.nationalId)||'—')+'</td><td>'+(esc(s.className)||'—')+'</td>'
      + '<td class="mono">'+(esc(s.parentPhone)||'—')+'</td><td class="mono">'+(esc(s.motherPhone)||'—')+'</td>'
      + '<td>'+(ok?'<span class="pill pill-green">آماده</span>':'<span class="pill pill-red">رد</span>')+'</td></tr>';
  }).join('');
  area.style.display = 'block';
  m.root.querySelector('#sdConfirmBtn').disabled = students.length === 0;
  var st = m.root.querySelector('#sdStatus');
  st.textContent = fa(students.length) + ' آماده ورود'; st.style.color = 'var(--green)';
}

          CFG.mode = 'local'; saveCFG();
          if (pollTimer) clearInterval(pollTimer);
          cloudOnline = false; setupMode = null;
          toast('حالت لوکال','success'); render();
        });
      } else if (target === 'file'){
        if (CFG.cloud){ delete CFG.cloud; if (pollTimer) clearInterval(pollTimer); }
        setupMode = 'file'; connectFile();
      } else {
        setupMode = 'cloud'; render();
        setTimeout(function(){ var f = document.getElementById('cloudForm'); if (f) f.scrollIntoView({behavior:'smooth', block:'start'}); }, 150);
      }
    };
  });

  if (document.getElementById('disconnectFileBtn')) document.getElementById('disconnectFileBtn').onclick = disconnectFile;
  if (document.getElementById('disconnectCloudBtn')) document.getElementById('disconnectCloudBtn').onclick = disconnectCloud;
  if (document.getElementById('cancelCloudBtn')) document.getElementById('cancelCloudBtn').onclick = function(){ setupMode = null; render(); };

  if (document.getElementById('copyBinIdBtn')){
    document.getElementById('copyBinIdBtn').onclick = function(){
      var id = CFG.cloud && CFG.cloud.binId;
      if (!id){ toast('Bin ID یافت نشد','error'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(id).then(function(){ toast('Bin ID کپی شد: '+id,'success'); })
          .catch(function(){ prompt('کپی کن:', id); });
      } else {
        prompt('کپی کن:', id);
      }
    };
  }

  // Create Bin
  if (document.getElementById('createBinBtn')){
    document.getElementById('createBinBtn').onclick = function(){
      var k = document.getElementById('cloudKey').value.trim();
      if (!k){ toast('اول کلید X-Master-Key را وارد کن','error'); return; }
      if (!confirm('یک Bin جدید ساخته می‌شود و داده‌های فعلی در آن ذخیره می‌شود.\n\nBin ID را جای امنی ذخیره کن.\n\nادامه؟')) return;
      var s = document.getElementById('cloudStatusText');
      s.textContent = '⏳ در حال ساخت Bin…'; s.style.color = 'var(--yellow)';
      createSharedBin(k).then(function(id){
        document.getElementById('cloudBin').value = id;
        try { localStorage.setItem(BIN_ID_KEY, id); } catch(e){}
        s.innerHTML = '✓ Bin ساخته شد — حالا «اتصال» را بزن<br><code dir="ltr">'+esc(id)+'</code>';
        s.style.color = 'var(--green)';
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(id).then(function(){
            toast('Bin ID کپی شد','success');
          });
        } else {
          alert('Bin ID:\n\n' + id + '\n\nکپی کن و جای امنی ذخیره کن.');
        }
      }).catch(function(e){
        s.textContent = '✕ ' + e.message; s.style.color = 'var(--red)';
        toast(e.message, 'error');
      });
    };
  }

  // Connect
  if (document.getElementById('connectCloudBtn')){
    document.getElementById('connectCloudBtn').onclick = function(){
      var k = document.getElementById('cloudKey').value.trim();
      var b = document.getElementById('cloudBin').value.trim();
      if (!k){ toast('کلید X-Master-Key را وارد کن','error'); return; }
      if (!b){ toast('Bin ID را وارد کن یا «ساخت Bin جدید» را بزن','error'); return; }
      var s = document.getElementById('cloudStatusText');
      s.textContent = '⏳ در حال اتصال…'; s.style.color = 'var(--yellow)';
      connectCloud(k, b).catch(function(e){
        s.textContent = '✕ ' + e.message; s.style.color = 'var(--red)';
        toast(e.message, 'error');
      });
    };
  }

  document.getElementById('saveSettings').onclick = function(){
    DB.settings.schoolName = document.getElementById('setSchool').value;
    DB.settings.academicYear = document.getElementById('setYear').value;
    DB.settings.resetMonths = Number(document.getElementById('setReset').value) || 2;
    var ys = document.getElementById('setYearStart').value;
    DB.settings.yearStartISO = ys ? new Date(ys).toISOString() : null;
    CFG.userName = document.getElementById('setUserName').value.trim();
    saveCFG();
    saveDB().then(function(){ toast('ذخیره شد','success'); render(); });
  };
  document.getElementById('saveTypes').onclick = function(){
    DB.violationTypes = DB.violationTypes.map(function(t){
      return Object.assign({}, t, {
        label: document.querySelector('[data-tid="'+t.id+'"][data-field="label"]').value,
        points: Number(document.querySelector('[data-tid="'+t.id+'"][data-field="points"]').value) || 1
      });
    });
    saveDB().then(function(){ toast('ذخیره شد','success'); });
  };
  document.getElementById('saveStations').onclick = function(){
    DB.stations = DB.stations.map(function(st){
      return Object.assign({}, st, {
        name: document.querySelector('[data-sid="'+st.id+'"][data-field="name"]').value,
        threshold: Number(document.querySelector('[data-sid="'+st.id+'"][data-field="threshold"]').value) || st.threshold,
        sports: document.querySelector('[data-sid="'+st.id+'"][data-field="sports"]').value
      });
    }).sort(function(a,b){ return a.threshold - b.threshold; });
    saveDB().then(function(){ toast('ذخیره شد','success'); render(); });
  };

  document.getElementById('setSchool').value = DB.settings.schoolName || '';
  document.getElementById('setYear').value = DB.settings.academicYear || '';
  document.getElementById('setReset').value = DB.settings.resetMonths || 2;
  document.getElementById('setYearStart').value = DB.settings.yearStartISO ? DB.settings.yearStartISO.slice(0,10) : '';
  document.getElementById('setUserName').value = CFG.userName || '';
  if (showCloudForm){
    document.getElementById('cloudKey').value = (CFG.cloud && CFG.cloud.apiKey) || '';
    document.getElementById('cloudBin').value = savedBin || '';
  }
}

/* ============================================================
   Backup
   ============================================================ */
function renderBackup(){
  var backups = []; try { backups = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]'); } catch(e){}
  var html = '<div class="grid-2">'
    + '<div class="card"><h3 class="card-title">پشتیبان‌گیری</h3>'
    + '<p style="font-size:13px;color:var(--text-dim);line-height:1.8;margin:0 0 16px">فایل پشتیبان شامل تمام داده‌ها است.</p>'
    + '<div class="row"><button class="btn btn-primary" id="expJson">⤓ JSON</button>'
    + '<button class="btn" id="expCsvS">⤓ CSV دانش‌آموزان</button>'
    + '<button class="btn" id="expCsvV">⤓ CSV تخلفات</button></div></div>'
    + '<div class="card"><h3 class="card-title">بازیابی از فایل</h3>'
    + '<p style="font-size:13px;color:var(--text-dim);line-height:1.8;margin:0 0 16px">با بارگذاری فایل، کل دیتابیس جایگزین می‌شود.</p>'
    + '<input type="file" id="importFile" accept=".json" style="display:none">'
    + '<button class="btn" id="impBtn">⤒ بارگذاری فایل</button></div></div>';

  html += '<div class="card" style="margin-top:20px"><h3 class="card-title">🗄️ پشتیبان محلی ('+fa(backups.length)+')</h3>';
  if (backups.length){
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    backups.forEach(function(b, i){
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;gap:10px">'
        + '<div style="min-width:0"><div style="font-size:12.5px;font-weight:600">'+(b._backedUpAt ? fmt(b._backedUpAt) : '—')+(b._tag ? ' · <span style="color:var(--yellow)">'+esc(b._tag)+'</span>' : '')+'</div>'
        + '<div style="font-size:11px;color:var(--text-dim);margin-top:3px">'+fa((b.students||[]).length)+' دانش‌آموز · '+fa((b.violations||[]).length)+' تخلف</div></div>'
        + '<button class="btn btn-sm" data-restore="'+i+'">بازیابی</button></div>';
    });
    html += '</div>';
  } else html += '<div style="color:var(--text-mute);font-size:13px">هنوز نسخه‌ای نیست</div>';
  html += '</div>';

  html += '<div class="card" style="margin-top:20px;border-color:rgba(255,58,94,.35)">'
    + '<h3 class="card-title" style="color:var(--red)">منطقه خطر</h3>'
    + '<p style="font-size:13px;color:var(--text-dim);line-height:1.8;margin:0 0 16px">کل سوابق آرشیو می‌شود.</p>'
    + '<button class="btn btn-danger" id="resetAll">↺ آرشیو کل سوابق</button></div>';
  document.getElementById('view').innerHTML = html;

  $$('[data-restore]').forEach(function(btn){
    btn.onclick = function(){
      var i = Number(btn.dataset.restore); var b = backups[i]; if (!b) return;
      if (!confirm('دیتابیس فعلی با این نسخه جایگزین شود؟')) return;
      DB = normalizeDB(JSON.parse(JSON.stringify(b)));
      delete DB._backedUpAt; delete DB._tag;
      DB.meta.lastModified = new Date().toISOString();
      saveDB().then(function(){ toast('بازیابی شد','success'); render(); });
    };
  });

  document.getElementById('expJson').onclick = function(){ download('discipline-backup-'+Date.now()+'.json', JSON.stringify(DB, null, 2), 'application/json'); };
  document.getElementById('expCsvS').onclick = function(){
    var rows = [['شماره دانش‌آموزی','نام','نام خانوادگی','کد ملی','کلاس','نوع ثبت‌نام','تلفن پدر','تلفن مادر','امتیاز','ایستگاه']];
    DB.students.forEach(function(s){
      var pts = totalPointsOf(s.id); var st = currentStation(pts);
      rows.push([s.studentNumber||'', s.firstName||'', s.lastName||'', s.nationalId||'', s.className||'', s.classType||'', s.parentPhone||'', s.motherPhone||'', pts, st?st.name:'—']);
    });
    download('students.csv', '\uFEFF'+rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n'), 'text/csv');
  };
  document.getElementById('expCsvV').onclick = function(){
    var rows = [['تاریخ','دانش‌آموز','کد ملی','نوع','ضریب','امتیاز','یادداشت']];
    DB.violations.slice().sort(function(a,b){ return new Date(b.occurredAt) - new Date(a.occurredAt); }).forEach(function(v){
      var s = DB.students.filter(function(x){ return x.id === v.studentId; })[0];
      var t = DB.violationTypes.filter(function(x){ return x.id === v.typeId; })[0];
      rows.push([new Date(v.occurredAt).toLocaleString('fa-IR'), s?fullName(s):'—', s?s.nationalId:'', t?t.label:'', v.multiplier, v.pointsApplied, v.note||'']);
    });
    download('violations.csv', '\uFEFF'+rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n'), 'text/csv');
  };
  document.getElementById('impBtn').onclick = function(){ document.getElementById('importFile').click(); };
  document.getElementById('importFile').onchange = function(e){
    var f = e.target.files[0]; if (!f) return;
    if (!confirm('کل دیتابیس جایگزین شود؟')) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var data = JSON.parse(r.result);
        if (!Array.isArray(data.students)) throw new Error('فایل نامعتبر');
        DB = normalizeDB(data);
        saveDB().then(function(){ toast('بازیابی شد','success'); render(); });
      } catch(err){ toast('خطا: '+err.message, 'error'); }
    };
    r.readAsText(f);
  };
  document.getElementById('resetAll').onclick = function(){
    if (!confirm('مطمئنی؟')) return;
    var now = new Date().toISOString();
    DB.violations.forEach(function(v){ v.archived = true; v.archivedAt = now; v.archiveReason = 'manual-reset'; });
    saveDB().then(function(){ toast('آرشیو شد','success'); render(); });
  };
}

function csvCell(c){ var s = String(c==null?'':c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function download(name, content, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:type}));
  a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* ============================================================
   چک نسخه
   ============================================================ */
function compareVersions(a, b){
  function p(v){ return String(v||'0').split('.').map(function(x){ return parseInt(x,10)||0; }); }
  var A = p(a), B = p(b), len = Math.max(A.length, B.length);
  for (var i=0; i<len; i++){
    var x = A[i]||0, y = B[i]||0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}
function checkForNewCode(){
  var base = location.href.split('#')[0].split('?')[0];
  fetch(base + '?_=' + Date.now(), { cache:'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(html){
      var m = html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
      if (!m) return;
      if (compareVersions(m[1], APP_VERSION) > 0){
        var b = document.getElementById('updateBanner');
        if (b){ b.querySelector('span').textContent = '🚀 نسخه جدید (' + m[1] + ') آماده است'; b.classList.add('show'); }
      }
    })
    .catch(function(){});
}
