<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه مدیریت انضباطی مدرسه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060c; --panel:rgba(14,18,30,.78); --border:rgba(110,150,220,.14);
  --border-2:rgba(0,229,255,.4); --text:#e7eefc; --text-dim:#8d97b0; --text-mute:#5b6478;
  --cyan:#00e5ff; --magenta:#ff2bd6; --green:#00ff9d; --yellow:#ffd60a;
  --orange:#ff8c1a; --red:#ff3a5e; --purple:#a855f7;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'Vazirmatn',system-ui,Tahoma,sans-serif;
  background:var(--bg);color:var(--text);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.bg-grid,.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-grid{
  background-image:linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 40%,transparent 90%);
}
.bg-glow{
  background:radial-gradient(ellipse 60% 40% at 15% 0%,rgba(0,229,255,.10),transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 100%,rgba(255,43,214,.08),transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 50%,rgba(168,85,247,.05),transparent 70%);
}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh;position:relative;z-index:1}
/* sidebar */
.sidebar{
  background:linear-gradient(180deg,rgba(10,13,22,.92),rgba(8,10,18,.86));
  border-left:1px solid var(--border);padding:22px 16px;
  display:flex;flex-direction:column;gap:22px;
  position:sticky;top:0;height:100vh;backdrop-filter:blur(20px);
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid var(--border)}
.brand-mark{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-weight:900;font-size:22px;color:#04060c;
  background:linear-gradient(135deg,var(--cyan),var(--magenta));
  box-shadow:0 0 20px rgba(0,229,255,.5),0 0 40px rgba(255,43,214,.25);
}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text strong{font-size:15px;letter-spacing:.3px}
.brand-text span{font-size:11px;color:var(--text-dim)}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;
  color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;
  border:1px solid transparent;transition:all .18s;position:relative;cursor:pointer;
}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.03);border-color:var(--border)}
.nav a.active{
  color:var(--cyan);background:linear-gradient(90deg,rgba(0,229,255,.10),rgba(0,229,255,.01));
  border-color:rgba(0,229,255,.30);box-shadow:inset 0 0 20px rgba(0,229,255,.06);
}
.nav a.active::before{
  content:'';position:absolute;right:-17px;top:8px;bottom:8px;width:3px;
  background:var(--cyan);border-radius:3px;box-shadow:0 0 12px var(--cyan);
}
.nav-ico{width:22px;text-align:center;font-size:14px;opacity:.85}
.sidebar-foot{display:flex;flex-direction:column;gap:8px}
.year-badge{
  font-size:12px;color:var(--cyan);padding:8px 12px;border-radius:8px;
  background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.20);text-align:center;
}
.hint{font-size:10.5px;color:var(--text-mute);text-align:center}
/* main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:16px;padding:18px 30px;
  border-bottom:1px solid var(--border);background:rgba(6,9,16,.55);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.4px}
.topbar-actions{margin-right:auto;display:flex;gap:12px;align-items:center}
.search-wrap{position:relative}
.search-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-mute);font-size:16px;pointer-events:none}
.search-wrap input{
  width:290px;padding:10px 38px 10px 14px;background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-family:inherit;font-size:13px;outline:none;transition:all .2s;
}
.search-wrap input:focus{
  border-color:var(--border-2);box-shadow:0 0 0 3px rgba(0,229,255,.08);
  background:rgba(0,229,255,.03);
}
.search-results{
  position:absolute;top:calc(100% + 8px);right:0;left:0;
  background:rgba(12,16,26,.98);border:1px solid var(--border-2);
  border-radius:12px;max-height:340px;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 24px rgba(0,229,255,.35);z-index:30;
}
.search-results.hidden{display:none}
.search-item{
  padding:11px 14px;cursor:pointer;font-size:13px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:rgba(0,229,255,.06)}
.view{padding:28px 30px 60px;flex:1;min-width:0}
/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
  font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--border);
  background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;transition:all .18s;
  text-decoration:none;
}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
.btn-primary{
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(0,229,255,.04));
  border-color:rgba(0,229,255,.55);color:var(--cyan);
  box-shadow:0 0 20px rgba(0,229,255,.15);
}
.btn-primary:hover{box-shadow:0 0 30px rgba(0,229,255,.35);background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(0,229,255,.08))}
.btn-danger{border-color:rgba(255,58,94,.5);color:#ff8ba3;background:rgba(255,58,94,.06)}
.btn-danger:hover{background:rgba(255,58,94,.14)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px}
.only-mobile{display:none}
/* cards */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;backdrop-filter:blur(16px);position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:var(--r);padding:1px;
  background:linear-gradient(135deg,rgba(0,229,255,.20),transparent 40%,transparent 60%,rgba(255,43,214,.15));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.card-title{
  font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:.4px;
  text-transform:uppercase;margin:0 0 16px;display:flex;align-items:center;gap:8px;
}
.card-title::before{content:'';width:3px;height:14px;background:var(--cyan);border-radius:2px;box-shadow:0 0 8px var(--cyan)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 20px;position:relative;overflow:hidden;backdrop-filter:blur(14px);
}
.stat::after{content:'';position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5}
.stat.s-mag::after{background:linear-gradient(90deg,transparent,var(--magenta),transparent)}
.stat.s-grn::after{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.stat.s-red::after{background:linear-gradient(90deg,transparent,var(--red),transparent)}
.stat-label{font-size:11.5px;color:var(--text-dim);letter-spacing:.4px;margin-bottom:10px}
.stat-value{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.5px}
.stat-sub{font-size:11px;color:var(--text-mute);margin-top:8px}
/* table */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:right;padding:13px 16px;font-weight:600;color:var(--text-dim);
  font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;
  border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);white-space:nowrap;
}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(0,229,255,.035)}
tbody tr:last-child td{border-bottom:none}
.row-name{font-weight:600;cursor:pointer}
.row-name:hover{color:var(--cyan)}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:12px;color:var(--text-dim);letter-spacing:.5px}
/* pills */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.3px;border:1px solid;
}
.pill-green{color:var(--green);background:rgba(0,255,157,.08);border-color:rgba(0,255,157,.30)}
.pill-cyan{color:var(--cyan);background:rgba(0,229,255,.08);border-color:rgba(0,229,255,.30)}
.pill-yellow{color:var(--yellow);background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.30)}
.pill-orange{color:var(--orange);background:rgba(255,140,26,.08);border-color:rgba(255,140,26,.30)}
.pill-red{color:var(--red);background:rgba(255,58,94,.08);border-color:rgba(255,58,94,.30)}
.pill-mag{color:var(--magenta);background:rgba(255,43,214,.08);border-color:rgba(255,43,214,.30)}
.pill-purple{color:var(--purple);background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.30)}
.pill-dim{color:var(--text-dim);background:rgba(255,255,255,.04);border-color:var(--border)}
/* score */
.score-card{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:26px 30px;margin-bottom:24px}
.score-num{font-size:78px;font-weight:900;line-height:1;letter-spacing:-3px;text-shadow:0 0 30px currentColor,0 0 60px currentColor;font-variant-numeric:tabular-nums}
.score-num small{font-size:20px;font-weight:500;opacity:.6;margin-right:8px;letter-spacing:0}
.score-meta{display:flex;flex-direction:column;gap:12px;min-width:0}
.score-label{font-size:12px;color:var(--text-dim);letter-spacing:.4px}
.progress{height:10px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.05)}
.progress-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px currentColor}
.progress-marks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-mute);margin-top:5px}
/* station */
.station-card{padding:22px;border-radius:var(--r);border:1px solid var(--border-2);background:linear-gradient(160deg,rgba(0,229,255,.05),transparent 60%);position:relative;overflow:hidden}
.station-card h3{margin:0 0 4px;font-size:16px;font-weight:700}
.station-card .thr{font-size:12px;color:var(--text-dim);margin-bottom:14px}
.station-actions{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.station-actions li{display:flex;gap:10px;font-size:13px;line-height:1.6;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border)}
.station-actions li::before{content:'▸';color:var(--cyan);font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:24px;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal{
  background:linear-gradient(160deg,rgba(14,18,30,.98),rgba(10,13,22,.98));
  border:1px solid var(--border-2);border-radius:18px;width:min(640px,100%);
  max-height:88vh;overflow:auto;box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 40px rgba(0,229,255,.12);
  animation:popIn .22s;
}
.modal.wide{width:min(860px,100%)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-close{background:transparent;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.modal-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
.modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;color:var(--text-dim);font-weight:500}
.field input,.field select,.field textarea{
  padding:10px 13px;background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:all .18s;
}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--border-2);box-shadow:0 0 0 3px rgba(0,229,255,.08);background:rgba(0,229,255,.03);
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* type grid */
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
.type-tile{
  padding:12px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--border);
  background:rgba(255,255,255,.02);display:flex;justify-content:space-between;gap:10px;
  align-items:center;transition:all .15s;text-align:right;
}
.type-tile:hover{border-color:rgba(0,229,255,.35);background:rgba(0,229,255,.04)}
.type-tile.selected{border-color:var(--cyan);background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(0,229,255,.02));box-shadow:0 0 20px rgba(0,229,255,.20)}
.type-tile .tt-label{font-size:12.5px;line-height:1.5}
.type-tile .tt-pts{
  font-weight:800;font-size:15px;color:var(--cyan);background:rgba(0,229,255,.08);
  border:1px solid rgba(0,229,255,.25);padding:4px 10px;border-radius:8px;white-space:nowrap;
}
/* preview */
.preview{padding:18px;border-radius:12px;background:linear-gradient(135deg,rgba(0,229,255,.06),rgba(255,43,214,.04));border:1px dashed rgba(0,229,255,.4);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center}
.preview .pv-item{display:flex;flex-direction:column;gap:4px}
.preview .pv-label{font-size:11px;color:var(--text-dim)}
.preview .pv-value{font-size:22px;font-weight:800;color:var(--cyan);text-shadow:0 0 12px currentColor}
.preview .pv-value.mag{color:var(--magenta)}
/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--text-mute);border:1px dashed var(--border);border-radius:var(--r)}
.empty .e-ico{font-size:44px;opacity:.35;margin-bottom:10px}
.empty .e-txt{font-size:14px}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:14px}
.rung{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;padding:18px 22px;border-radius:14px;background:var(--panel);border:1px solid var(--border);position:relative}
.rung.active{border-color:var(--border-2);box-shadow:0 0 24px rgba(0,229,255,.10)}
.rung .thr-big{font-size:26px;font-weight:900;text-align:center;text-shadow:0 0 16px currentColor}
.rung h4{margin:0 0 4px;font-size:14.5px}
.rung p{margin:0;font-size:12px;color:var(--text-dim)}
.rung .count-pill{font-size:11.5px;padding:5px 12px}
/* toast */
.toast{
  position:fixed;bottom:26px;left:26px;padding:13px 20px;border-radius:12px;
  background:rgba(12,16,26,.98);border:1px solid var(--border-2);color:var(--text);
  font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(0,229,255,.35);
  transform:translateY(120%);transition:transform .35s cubic-bezier(.4,0,.2,1);
  z-index:200;max-width:380px;
}
.toast.show{transform:translateY(0)}
.toast.success{border-color:rgba(0,255,157,.5);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(0,255,157,.25)}
.toast.error{border-color:rgba(255,58,94,.6);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(255,58,94,.25)}
/* responsive */
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;right:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .only-mobile{display:inline-flex}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:16px}
  .view{padding:18px 16px 50px}
  .search-wrap input{width:170px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .score-card{grid-template-columns:1fr;text-align:center}
  .score-num{font-size:60px}
  .preview{grid-template-columns:1fr}
  .rung{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">آ</div>
      <div class="brand-text">
        <strong>انضباط هوشمند</strong>
        <span id="brandSchool">دبیرستان</span>
      </div>
    </div>
    <nav class="nav">
      <a data-route="dashboard"><span class="nav-ico">◈</span><span>داشبورد</span></a>
      <a data-route="students"><span class="nav-ico">◉</span><span>دانش‌آموزان</span></a>
      <a data-route="quick"><span class="nav-ico">✦</span><span>ثبت تخلف</span></a>
      <a data-route="stations"><span class="nav-ico">⚑</span><span>ایستگاه‌ها</span></a>
      <a data-route="settings"><span class="nav-ico">⚙</span><span>تنظیمات</span></a>
      <a data-route="backup"><span class="nav-ico">⤓</span><span>پشتیبان‌گیری</span></a>
    </nav>
    <div class="sidebar-foot">
      <div id="yearBadge" class="year-badge">سال تحصیلی —</div>
      <div class="hint">نسخه ۱.۰ · بدون سرور</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn">☰</button>
      <h1 id="pageTitle">داشبورد</h1>
      <div class="topbar-actions">
        <div class="search-wrap">
          <span class="search-ico">⌕</span>
          <input id="globalSearch" type="search" placeholder="جستجو (نام یا کد ملی)…" autocomplete="off">
          <div id="searchResults" class="search-results hidden"></div>
        </div>
        <button class="btn btn-primary" id="addStudentBtn"><span>＋</span> دانش‌آموز جدید</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   سامانه مدیریت انضباطی — نسخه تک‌فایلی
   ذخیره‌سازی در localStorage
   ============================================================ */

/* ---------- تقویم شمسی ---------- */
const Jalali = (function(){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  function toJalali(gy, gm, gd){
    let jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;
    const gy2 = (gm > 2) ? (gy + 1) : gy;
    let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100)
             + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
    jy += 33 * Math.floor(days/12053);
    days %= 12053;
    jy += 4 * Math.floor(days/1461);
    days %= 1461;
    if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1) % 365; }
    const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
    const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
    return [jy, jm, jd];
  }
  const FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function fa(n){ return String(n).replace(/\d/g, d => FA[+d]); }
  function fmt(iso, opts={}){
    if (!iso) return '—';
    const d = new Date(iso);
    const [jy, jm, jd] = toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
    const date = `${fa(jy)}/${fa(String(jm).padStart(2,'0'))}/${fa(String(jd).padStart(2,'0'))}`;
    if (opts.dateOnly) return date;
    const hh = fa(String(d.getHours()).padStart(2,'0'));
    const mm = fa(String(d.getMinutes()).padStart(2,'0'));
    return `${date} — ${hh}:${mm}`;
  }
  function relative(iso){
    if (!iso) return '';
    const diff = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diff/60000);
    if (min < 1) return 'همین حالا';
    if (min < 60) return `${fa(min)} دقیقه پیش`;
    const h = Math.floor(min/60);
    if (h < 24) return `${fa(h)} ساعت پیش`;
    const d = Math.floor(h/24);
    if (d < 30) return `${fa(d)} روز پیش`;
    const mo = Math.floor(d/30);
    if (mo < 12) return `${fa(mo)} ماه پیش`;
    return `${fa(Math.floor(mo/12))} سال پیش`;
  }
  return { toJalali, fa, fmt, relative };
})();
const { fa, fmt, relative } = Jalali;

/* ---------- ذخیره‌سازی ---------- */
const STORAGE_KEY = 'school-discipline-v1';
function defaultDB(){
  const now = new Date();
  return {
    students: [],
    violations: [],
    violationTypes: JSON.parse(JSON.stringify(DEFAULT_TYPES)),
    stations: JSON.parse(JSON.stringify(DEFAULT_STATIONS)),
    settings: {
      schoolName: 'دبیرستان نمونه',
      academicYear: '۱۴۰۴-۱۴۰۵',
      yearStartISO: new Date(now.getFullYear(), 2, 21).toISOString(),
      resetMonths: 2,
    },
    meta: { version: 1 },
  };
}
let DB = loadDB();

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultDB();
    const db = JSON.parse(raw);
    db.violationTypes ||= JSON.parse(JSON.stringify(DEFAULT_TYPES));
    db.stations       ||= JSON.parse(JSON.stringify(DEFAULT_STATIONS));
    db.settings       ||= defaultDB().settings;
    db.students       ||= [];
    db.violations     ||= [];
    return db;
  } catch(e){
    console.error('DB error:', e);
    return defaultDB();
  }
}
function saveDB(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('خطا در ذخیره‌سازی: '+e.message, 'error'); }
}

/* ---------- منطق آیین‌نامه ---------- */
function applyAutoReset(){
  const months = Number(DB.settings.resetMonths) || 2;
  const resetMs = months * 30 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const groups = new Map();
  for (const v of DB.violations){
    if (v.archived) continue;
    const key = v.studentId + '|' + v.typeId;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(v);
  }
  let changed = false;
  for (const [, list] of groups){
    const latest = Math.max(...list.map(v => new Date(v.occurredAt).getTime()));
    if (now - latest > resetMs){
      list.forEach(v => { v.archived = true; v.archivedAt = new Date().toISOString(); v.archiveReason = 'auto-reset'; });
      changed = true;
    }
  }
  if (changed) saveDB();
}
function yearStartMs(){
  return DB.settings.yearStartISO ? new Date(DB.settings.yearStartISO).getTime() : 0;
}
function activeViolationsOf(studentId){
  const ys = yearStartMs();
  return DB.violations
    .filter(v => v.studentId===studentId && !v.archived && new Date(v.occurredAt).getTime() >= ys)
    .sort((a,b) => new Date(b.occurredAt) - new Date(a.occurredAt));
}
function totalPointsOf(studentId){
  return activeViolationsOf(studentId).reduce((s,v)=>s+v.pointsApplied, 0);
}
function typeCountsOf(studentId){
  const m = {};
  for (const v of activeViolationsOf(studentId)) m[v.typeId] = (m[v.typeId]||0)+1;
  return m;
}
function countPriorOccurrences(studentId, typeId){
  return typeCountsOf(studentId)[typeId] || 0;
}
function multiplierFor(prior){
  const k = prior + 1;
  if (k <= 2) return 1;
  if (k <= 4) return 2;
  if (k <= 6) return 3;
  return 4;
}
function currentStation(points){
  let cur = null;
  for (const s of DB.stations) if (points >= s.threshold) cur = s;
  return cur;
}
function nextStation(points){
  for (const s of DB.stations) if (points < s.threshold) return s;
  return null;
}
function scoreColor(points){
  if (points === 0) return 'var(--green)';
  if (points < 15)  return 'var(--cyan)';
  if (points < 30)  return 'var(--yellow)';
  if (points < 45)  return 'var(--orange)';
  if (points < 65)  return 'var(--red)';
  if (points < 80)  return '#ff1f4d';
  if (points < 100) return 'var(--magenta)';
  return 'var(--purple)';
}
function scorePillClass(points){
  if (points === 0) return 'pill-green';
  if (points < 15)  return 'pill-cyan';
  if (points < 30)  return 'pill-yellow';
  if (points < 45)  return 'pill-orange';
  if (points < 65)  return 'pill-red';
  if (points < 80)  return 'pill-red';
  if (points < 100) return 'pill-mag';
  return 'pill-purple';
}

    DB.students = DB.students.filter(x => x.id !== s.id);

    saveDB(); toast('دانش‌آموز حذف شد', 'success'); navigate('students');

}
function undoViolation(id){
  if (!confirm('این تخلف حذف شود؟')) return;
  DB.violations = DB.violations.filter(v => v.id !== id);
  saveDB(); toast('تخلف حذف شد', 'success'); render();
}

/* ============================================================
   Quick log
   ============================================================ */
let quickSelection = { studentId:null, typeId:null };

function renderQuick(){
  const pre = quickSelection.studentId;
  const selectedStudent = pre ? DB.students.find(s => s.id === pre) : null;
  const selectedType = quickSelection.typeId ? DB.violationTypes.find(t=>t.id===quickSelection.typeId) : null;

  let previewHTML = '';
  if (selectedStudent && selectedType) {
    const prior = countPriorOccurrences(selectedStudent.id, selectedType.id);
    const mult = multiplierFor(prior);
    const applied = selectedType.points * mult;
    previewHTML = `
      <div class="preview">
        <div class="pv-item">
          <span class="pv-label">این چندمین بار</span>
          <span class="pv-value">${fa(prior+1)}<small style="font-size:12px;opacity:.6"> مین</small></span>
        </div>
        <div class="pv-item">
          <span class="pv-label">ضریب اعمال‌شده</span>
          <span class="pv-value ${mult>1?'mag':''}">×${fa(mult)}</span>
        </div>
        <div class="pv-item">
          <span class="pv-label">امتیاز نهایی</span>
          <span class="pv-value ${mult>1?'mag':''}">−${fa(applied)}</span>
        </div>
      </div>
    `;
  }

  $('#view').innerHTML = `
    <div class="grid-2">
      <div class="stack">
        <div class="card">
          <h3 class="card-title">۱. انتخاب دانش‌آموز</h3>
          ${selectedStudent ? `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:10px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.3);gap:10px">
              <div style="min-width:0">
                <div style="font-weight:600">${esc(fullName(selectedStudent))}</div>
                <div style="font-size:11.5px;color:var(--text-dim);margin-top:3px">${esc(selectedStudent.grade||'—')}${selectedStudent.className?' / '+esc(selectedStudent.className):''} · امتیاز فعلی −${fa(totalPointsOf(selectedStudent.id))}</div>
              </div>
              <button class="btn btn-sm" id="changeStudent">تغییر</button>
            </div>
          ` : `
            <div class="field">
              <label>جستجو کنید…</label>
              <input id="qStudent" placeholder="نام یا کد ملی…" autocomplete="off">
              <div id="qStudentList" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto"></div>
            </div>
          `}
        </div>

        <div class="card">
          <h3 class="card-title">۲. نوع تخلف</h3>
          <div class="type-grid">
            ${DB.violationTypes.map(t => `
              <div class="type-tile ${quickSelection.typeId===t.id?'selected':''}" data-type="${t.id}">
                <div class="tt-label">${esc(t.label)}</div>
                <div class="tt-pts">−${fa(t.points)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <h3 class="card-title">۳. پیش‌نمایش اثر</h3>
          ${previewHTML || `<div style="color:var(--text-mute);font-size:13px;padding:10px 0">دانش‌آموز و نوع تخلف را انتخاب کنید</div>`}
        </div>

        ${(selectedStudent && selectedType) ? `
          <div class="card">
            <h3 class="card-title">۴. تاریخ و یادداشت</h3>
            <div class="field">
              <label>تاریخ و ساعت وقوع</label>
              <input type="datetime-local" id="qWhen">
            </div>
            <div class="field" style="margin-top:12px">
              <label>یادداشت (اختیاری)</label>
              <textarea id="qNote" placeholder="توضیح مختصر…"></textarea>
            </div>
            <button class="btn btn-primary" id="qSubmit" style="margin-top:16px;width:100%;justify-content:center;padding:13px">
              ثبت تخلف و اعمال امتیاز
            </button>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  if (!selectedStudent) {
    const q = $('#qStudent');
    const list = $('#qStudentList');
    const renderList = () => {
      const v = q.value.trim().toLowerCase();
      const items = DB.students.filter(s => !v || (fullName(s)+' '+s.nationalId).toLowerCase().includes(v)).slice(0, 30);
      list.innerHTML = items.map(s => `
        <div class="search-item" data-sid="${s.id}">
          <span>${esc(fullName(s))}</span>
          <span style="color:var(--text-mute);font-size:11px">−${fa(totalPointsOf(s.id))}</span>
        </div>
      `).join('') || '<div style="color:var(--text-mute);font-size:12.5px;padding:8px">موردی یافت نشد</div>';
      list.querySelectorAll('[data-sid]').forEach(el => el.onclick = () => {
        quickSelection.studentId = el.dataset.sid;
        renderQuick();
      });
    };
    q.addEventListener('input', renderList);
    renderList();
    q.focus();
  } else {
    $('#changeStudent').onclick = () => { quickSelection.studentId = null; renderQuick(); };
  }

  $$('[data-type]').forEach(el => el.onclick = () => {
    quickSelection.typeId = el.dataset.type;
    renderQuick();
  });

  const whenInput = $('#qWhen');
  if (whenInput && !whenInput.value) {
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    whenInput.value = d.toISOString().slice(0,16);
  }

  const sub = $('#qSubmit');
  if (sub) sub.onclick = () => {
    const when = whenInput.value ? new Date(whenInput.value).toISOString() : new Date().toISOString();
    const prior = countPriorOccurrences(selectedStudent.id, selectedType.id);
    const mult = multiplierFor(prior);
    const applied = selectedType.points * mult;

    const v = {
      id: uid('vio'),
      studentId: selectedStudent.id,
      typeId: selectedType.id,
      occurredAt: when,
      note: $('#qNote').value.trim(),
      priorCount: prior,
      occurrenceNumber: prior + 1,
      basePoints: selectedType.points,
      multiplier: mult,
      pointsApplied: applied,
      archived: false,
      createdAt: new Date().toISOString(),
    };
    DB.violations.push(v);
    saveDB();
    toast(`تخلف ثبت شد — ${fa(applied)}− امتیاز (×${fa(mult)})`, 'success');
    quickSelection = { studentId:null, typeId:null };
    navigate('student', selectedStudent.id);
  };
}

/* ============================================================
   Stations
   ============================================================ */
function renderStations(){
  const nextThr = thr => {
    for (const s of DB.stations) if (s.threshold > thr) return s.threshold;
    return Infinity;
  };
  $('#view').innerHTML = `
    <div style="margin-bottom:20px;color:var(--text-dim);font-size:13px;line-height:1.7">
      با تجمیع امتیازات منفی، هر ایستگاه به‌صورت خودکار فعال می‌شود. هر ایستگاه شامل پیامدهای انباشته‌ی ایستگاه‌های قبلی نیز هست.
    </div>
    <div class="ladder">
      ${DB.stations.map(st => {
        const upper = nextThr(st.threshold);
        const students = DB.students.filter(s => {
          const p = totalPointsOf(s.id);
          return p >= st.threshold && p < upper;
        });
        const isAny = DB.students.some(s => totalPointsOf(s.id) >= st.threshold);
        return `
          <div class="rung ${isAny?'active':''}">
            <div class="thr-big" style="color:${scoreColor(st.threshold)}">−${fa(st.threshold)}</div>
            <div>
              <h4>${esc(st.name)}</h4>
              <p style="color:var(--cyan);margin-bottom:8px">⚑ ${esc(st.sports)}</p>
              <ul class="station-actions">
                ${st.actions.map(a => `<li>${esc(a)}</li>`).join('')}
              </ul>
            </div>
            <div style="text-align:center">
              <div class="pill pill-cyan count-pill" style="font-size:14px;padding:8px 16px">${fa(students.length)}</div>
              <div style="font-size:10.5px;color:var(--text-mute);margin-top:6px">دانش‌آموز</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

  $('#expJson').onclick = () => download(`discipline-backup-${Date.now()}.json`, JSON.stringify(DB, null, 2), 'application/json');
  $('#expCsvS').onclick = () => {
    const rows = [['نام','کد ملی','پایه','کلاس','تلفن ولی','امتیاز منفی','ایستگاه']];
    for (const s of DB.students) {
      const pts = totalPointsOf(s.id);
      const st = currentStation(pts);
      rows.push([fullName(s), s.nationalId, s.grade, s.className, s.parentPhone, pts, st?st.name:'—']);
    }
    download('students.csv', '\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'), 'text/csv');
  };
  $('#expCsvV').onclick = () => {
    const rows = [['تاریخ','دانش‌آموز','کد ملی','نوع تخلف','ضریب','امتیاز','یادداشت']];
    for (const v of [...DB.violations].sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt))) {
      const s = DB.students.find(x=>x.id===v.studentId);
      const t = DB.violationTypes.find(x=>x.id===v.typeId);
      rows.push([new Date(v.occurredAt).toLocaleString('fa-IR'), s?fullName(s):'—', s?s.nationalId:'', t?t.label:'', v.multiplier, v.pointsApplied, v.note||'']);
    }
    download('violations.csv', '\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'), 'text/csv');
  };
  $('#impBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm('کل دیتابیس با فایل انتخاب‌شده جایگزین شود؟')) return;
    const text = await f.text();
    try {
      const data = JSON.parse(text);
      if (!Array.isArray(data.students)) throw new Error('فایل نامعتبر');
      DB = data;
      DB.violationTypes ||= JSON.parse(JSON.stringify(DEFAULT_TYPES));
      DB.stations ||= JSON.parse(JSON.stringify(DEFAULT_STATIONS));
      DB.settings ||= defaultDB().settings;
      DB.violations ||= [];
      saveDB(); toast('بازیابی انجام شد', 'success'); render();
    } catch(err){ toast('فایل نامعتبر: '+err.message, 'error'); }
  };
  $('#resetAll').onclick = () => {
    if (!confirm('آیا مطمئنید؟ کل سوابق آرشیو می‌شود.')) return;
    const now = new Date().toISOString();
    DB.violations.forEach(v => { v.archived = true; v.archivedAt = now; v.archiveReason = 'manual-reset'; });
    saveDB(); toast('کل سوابق آرشیو شد', 'success'); render();
  };
}
function csvCell(c){
  const s = String(c ?? '');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function download(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============================================================
   Student form
   ============================================================ */
function openStudentForm(student){
  const isEdit = !!student;
  const body = `
    <div class="field-row">
      <div class="field"><label>نام *</label><input id="fFirstName" value="${esc(student?.firstName||'')}"></div>
      <div class="field"><label>نام خانوادگی *</label><input id="fLastName" value="${esc(student?.lastName||'')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>کد ملی</label><input id="fNationalId" value="${esc(student?.nationalId||'')}"></div>
      <div class="field"><label>تلفن دانش‌آموز</label><input id="fStudentPhone" value="${esc(student?.studentPhone||'')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>پایه</label><input id="fGrade" value="${esc(student?.grade||'')}" placeholder="مثلاً دهم"></div>
      <div class="field"><label>کلاس</label><input id="fClassName" value="${esc(student?.className||'')}" placeholder="مثلاً ۱۰۲"></div>
    </div>
    <div class="field"><label>تلفن ولی</label><input id="fParentPhone" value="${esc(student?.parentPhone||'')}"></div>
    <div class="field"><label>آدرس</label><input id="fAddress" value="${esc(student?.address||'')}"></div>
    <div class="field"><label>یادداشت</label><textarea id="fNotes">${esc(student?.notes||'')}</textarea></div>
  `;
  const footer = `
    <button class="btn" data-cancel>انصراف</button>
    <button class="btn btn-primary" data-save>${isEdit?'ذخیره تغییرات':'ثبت دانش‌آموز'}</button>
  `;
  const { root, close } = openModal({ title: isEdit?'ویرایش دانش‌آموز':'دانش‌آموز جدید', body, footer });

  root.querySelector('[data-cancel]').onclick = close;
  root.querySelector('[data-save]').onclick = () => {
    const payload = {
      firstName: $('#fFirstName').value.trim(),
      lastName:  $('#fLastName').value.trim(),
      nationalId:$('#fNationalId').value.trim(),
      grade:     $('#fGrade').value.trim(),
      className: $('#fClassName').value.trim(),
      parentPhone:$('#fParentPhone').value.trim(),
      studentPhone:$('#fStudentPhone').value.trim(),
      address:   $('#fAddress').value.trim(),
      notes:     $('#fNotes').value.trim(),
    };
    if (!payload.firstName && !payload.lastName) { toast('نام الزامی است','error'); return; }
    if (isEdit) {
      Object.assign(student, payload);
    } else {
      const s = { id: uid('stu'), ...payload, createdAt: new Date().toISOString() };
      DB.students.push(s);
    }
    saveDB(); close(); toast(isEdit?'ویرایش شد':'دانش‌آموز ثبت شد','success');
    if (!isEdit) { if (getRoute().route === 'students') render(); else navigate('students'); }
    else render();
  };
}

/* ============================================================
   Wiring
   ============================================================ */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('.nav a');
  if (nav) { navigate(nav.dataset.route); }
});
$('#addStudentBtn').onclick = () => openStudentForm(null);
$('#menuBtn').onclick = () => $('#sidebar').classList.toggle('open');
window.addEventListener('hashchange', render);

// Global search
const gs = $('#globalSearch');
const gsResults = $('#searchResults');
gs.addEventListener('input', () => {
  const q = gs.value.trim().toLowerCase();
  if (!q) { gsResults.classList.add('hidden'); return; }
  const items = DB.students.filter(s => (fullName(s)+' '+s.nationalId).toLowerCase().includes(q)).slice(0, 8);
  if (!items.length) {
    gsResults.innerHTML = `<div class="search-item" style="cursor:default;color:var(--text-mute)">نتیجه‌ای یافت نشد</div>`;
  } else {
    gsResults.innerHTML = items.map(s => `
      <div class="search-item" data-sid="${s.id}">
        <div>
          <div style="font-weight:600">${esc(fullName(s))}</div>
          <div style="font-size:11px;color:var(--text-mute);margin-top:2px">${esc(s.grade||'')}${s.className?' / '+esc(s.className):''} ${s.nationalId?'· '+esc(s.nationalId):''}</div>
        </div>
        <div class="pill ${scorePillClass(totalPointsOf(s.id))}">−${fa(totalPointsOf(s.id))}</div>
      </div>
    `).join('');
    gsResults.querySelectorAll('[data-sid]').forEach(el => el.onclick = () => {
      navigate('student', el.dataset.sid);
      gsResults.classList.add('hidden'); gs.value = '';
    });
  }
  gsResults.classList.remove('hidden');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) gsResults.classList.add('hidden');
});

// Expose to inline handlers
window.navigate = navigate;
window.undoViolation = undoViolation;

// Init
(function init(){
  applyAutoReset();
  if (!location.hash) location.hash = '#/dashboard';
  render();
})();
</script>
